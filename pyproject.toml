[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qgis-toolkit"
version = "0.1.0"
description = "Professional QGIS Python toolkit for geospatial analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Matej Martinović", email = "matt123.3a@gmail.com" }
]
keywords = ["qgis", "gis", "geospatial", "boulder", "raster", "vector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.1.0",
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "fiona>=1.9.0",
    "rasterio>=1.3.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
qgis = [
    "qgis>=3.34",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
qgis-toolkit = "qgis_toolkit.cli.main:app"

[project.urls]
Homepage = "https://github.com/1244Matt1244/qgis_project_python2"
Repository = "https://github.com/1244Matt1244/qgis_project_python2"
Issues = "https://github.com/1244Matt1244/qgis_project_python2/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fiona.*", "rasterio.*", "qgis.*", "osgeo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, no QGIS)",
    "integration: Integration tests (require QGIS)",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src/qgis_toolkit"]
omit = ["tests/*", "src/qgis_toolkit/cli/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
